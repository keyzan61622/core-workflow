name: keep-repo-alive

on:
  schedule:
    - cron: '0 0 1 * *'  # jam 00:00 UTC, tanggal 1 tiap bulan
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          mkdir -p .github
          echo "Last keep-alive ping: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > .github/keepalive.txt

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keep-alive ping [skip ci]" || echo "Tidak ada perubahan, skip commit"
          git push
