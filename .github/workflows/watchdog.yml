name: pterodactyl-watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    environment: PANEL_API_KEY
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Jalankan watchdog
        run: node watchdog.js
        env:
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
